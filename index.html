<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SFX Manager</title>
  <link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><rect width="24" height="24" rx="6" fill="%234d8dff"/><rect x="5" y="9" width="2.4" height="6" rx="1.2" fill="white"/><rect x="9.6" y="5.5" width="2.4" height="13" rx="1.2" fill="white"/><rect x="14.2" y="8" width="2.4" height="8" rx="1.2" fill="white"/><rect x="18.8" y="10.5" width="2.4" height="3" rx="1.2" fill="white"/></svg>'>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="#fff">
          <rect x="3" y="9" width="2.6" height="6" rx="1.3"/>
          <rect x="8" y="5" width="2.6" height="14" rx="1.3"/>
          <rect x="13" y="8" width="2.6" height="8" rx="1.3"/>
          <rect x="18" y="10.5" width="2.6" height="3" rx="1.3"/>
        </svg>
      </span>
      <div class="brand-text">
        <h1>SFX Manager</h1>
        <p id="count">—</p>
      </div>
    </div>

    <div class="topbar-actions">
      <label class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle>
          <path d="m20 20-3.5-3.5"></path>
        </svg>
        <input id="search" type="text" placeholder="Search sounds…" autocomplete="off" spellcheck="false" aria-label="Search sounds">
        <kbd>/</kbd>
      </label>
      <button class="btn-primary" id="importBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
          <path d="M12 5v14M5 12h14"></path>
        </svg>
        Import sounds
      </button>
    </div>
  </header>

  <div class="toolbar">
    <div class="chips" id="chips" aria-label="Filter by category"></div>
    <label class="select">
      <select id="sort" aria-label="Sort sounds">
        <option value="name">Name A–Z</option>
        <option value="short">Shortest first</option>
        <option value="long">Longest first</option>
        <option value="recent">Recently added</option>
      </select>
    </label>
  </div>

  <main class="library" id="library" aria-label="Sound library"></main>

  <footer class="player idle" id="player">
    <div class="player-top">
      <div class="player-meta">
        <div class="player-name-row">
          <span class="dot" id="pDot"></span>
          <h2 class="player-name" id="pName">No sound selected</h2>
        </div>
        <p class="player-sub" id="pSub">Pick a card to preview it here</p>
      </div>
      <div class="wave-wrap" id="waveWrap" tabindex="0" role="slider" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <canvas id="wave"></canvas>
        <div class="wave-tip" id="waveTip">Click the waveform to scrub</div>
        <div class="wave-bubble" id="waveBubble">0:00</div>
      </div>
    </div>

    <div class="player-controls">
      <div class="transport">
        <button class="ctrl" id="back5" type="button" title="Back 5 seconds" aria-label="Back 5 seconds">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M11 19 2 12l9-7v14z"></path>
            <path d="m22 19-9-7 9-7v14z"></path>
          </svg>
        </button>
        <button class="play" id="playBtn" type="button" title="Play (Space)" aria-label="Play or pause"></button>
        <button class="ctrl" id="fwd5" type="button" title="Forward 5 seconds" aria-label="Forward 5 seconds">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="m13 5 9 7-9 7V5z"></path>
            <path d="M2 5l9 7-9 7V5z"></path>
          </svg>
        </button>
      </div>

      <span class="time" id="time">0:00.0 / 0:00.0</span>
      <span class="divider" aria-hidden="true"></span>

      <div class="vol">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M11 5 6 9H2v6h4l5 4V5z"></path>
          <path d="M15.5 8.6a4.8 4.8 0 0 1 0 6.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
          <path d="M18.3 6a8.6 8.6 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
        </svg>
        <input type="range" id="vol" min="0" max="1" step="0.01" value="0.9" aria-label="Volume">
      </div>
      <span class="divider" aria-hidden="true"></span>

      <div class="speed" id="speed" role="group" aria-label="Playback speed">
        <button type="button" data-rate="0.5">.5×</button>
        <button type="button" data-rate="1" class="on">1×</button>
        <button type="button" data-rate="1.5">1.5×</button>
        <button type="button" data-rate="2">2×</button>
      </div>
    </div>
  </footer>

  <input type="file" id="fileInput" accept="audio/*" multiple hidden>

  <script src="js/synth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
